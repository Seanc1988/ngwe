name: Event Desk daily database health check

on:
  schedule:
    # 13:37 UTC daily (8:37 AM EST / 9:37 AM EDT).
    - cron: '37 13 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/event-desk-daily-health.yml'

permissions:
  contents: read

concurrency:
  group: event-desk-daily-health
  cancel-in-progress: false

jobs:
  database-read:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read the lightweight database health endpoint
        shell: python
        run: |
          import json
          import time
          import urllib.request
          import urllib.error

          # Reads only the workspace row ID, never the multi-megabyte workspace.
          # No client records, credentials or catalog contents are written to logs.
          url = "https://north-georgia-booking-forms.seanc88.chatgpt.site/api/public/health"
          for attempt in range(3):
              try:
                  request = urllib.request.Request(url, headers={
                      "User-Agent": "NGWE-Event-Desk-Daily-Health/1.0",
                      "Cache-Control": "no-cache",
                      "Accept": "application/json",
                  })
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 200:
                          raise RuntimeError("Unexpected HTTP status")
                      payload = json.load(response)
                  if not isinstance(payload, dict) or payload.get("healthy") is not True or payload.get("database") is not True:
                      raise RuntimeError("Unexpected health response")
                  print("PASS: Event Desk lightweight database read succeeded.")
                  break
              except urllib.error.HTTPError as error:
                  print("Attempt", attempt + 1, "failed: HTTP", error.code)
                  if error.code == 402:
                      raise SystemExit("FAIL: Supabase service is quota-restricted (HTTP 402). Login and client APIs are also unavailable. Restore the quota before retesting.")
                  if attempt == 2:
                      raise SystemExit("FAIL: Event Desk database-backed health check failed.")
                  time.sleep(5 * (attempt + 1))
              except Exception as error:
                  print("Attempt", attempt + 1, "failed:", type(error).__name__)
                  if attempt == 2:
                      raise SystemExit("FAIL: Event Desk database-backed health check failed.")
                  time.sleep(5 * (attempt + 1))
